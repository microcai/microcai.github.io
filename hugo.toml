baseURL = "https://microcai.org/"
title = "菜菜博士"
defaultContentLanguage = "zh-cn"
# front matter 里的 date 不带时区，Hugo 默认按 UTC 零点解析；
# 机器时钟是北京时间时，当天发的文章会被当成"未来"而不发布，所以按东八区解析
timezone = "Asia/Shanghai"
theme = "PaperMod"

# 保留 Jekyll 时代的 .html 后缀。
# 老文章的完整 URL 已逐篇用 front matter 的 url: 钉死（/2026/10/31/xxx.html），
# 不再依赖下面的 permalinks 规则；这两种设置只作用于之后的新文章。
uglyURLs = true
# 路径统一小写：正文里有 DC/dc、PCIe/PCIE 这类只差大小写的标签，
# Hugo 按小写键合并词条后，用哪个写法做 URL 是不确定的，会随构建翻转。
# 老文章的 URL 已由 front matter 的 url: 按字面固定，不受此项影响。
disablePathToLower = false
enableRobotsTXT = true
# 未来日期的文章也照样构建：提前出现在首页/RSS/sitemap，剧透无所谓
buildFuture = true

[frontmatter]
  # date 优先取 front matter，缺失时从文件名（2026-11-18-xxx.md）解析
  date = [":default", ":filename"]

[pagination]
  pagerSize = 20

[permalinks]
  # 新文章沿用老的 URL 形态：2026-11-18-foo.md → /2026/11/18/foo.html
  # slug 与 date 都不用写在 front matter：前者由文件名去掉日期前缀得到，后者从文件名解析
  posts = "/:year/:month/:day/:slug"

[taxonomies]
  tag = "tags"

[markup.goldmark.renderer]
  # 正文里有手写的 <sub>、<span> 等 HTML
  unsafe = true

# 公式交给 Goldmark 的 passthrough 保护起来，再由渲染钩子转成 MathML
[markup.goldmark.extensions.passthrough]
  enable = true

[markup.goldmark.extensions.passthrough.delimiters]
  # 只认 $$ 作为块级公式：正文里的 \[1\]\[2\] 是引用编号，不能当公式吃掉
  block = [['$$', '$$']]
  inline = [['\(', '\)'], ['$', '$']]

# 旧的订阅地址是 /feed.xml，继续沿用
[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "feed"

# 搜索页要读取首页生成的 index.json
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  comments = true

  [params.homeInfoParams]
    Title = "菜菜博士"
    Content = "博士在网络的家。这里写技术，偶尔聊点别的。"

  [params.assets]
    disableHLJS = true

  [params.label]
    text = "菜菜博士"

  [params.footer]
    text = ""

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    includeScore = true
    minMatchCharLength = 1
    keys = ["title", "permalink", "summary", "content"]
    threshold = 0.3
    ignoreLocation = true
    useExtendedSearch = true
    ignoreFieldNorm = true

[[menu.main]]
  name = "文章"
  url = "/"
  weight = 10

[[menu.main]]
  name = "技术翻译"
  pageRef = "/translist.html"
  weight = 12

[[menu.main]]
  name = "归档"
  url = "/archive.html"
  weight = 20

[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 30

[[menu.main]]
  name = "搜索"
  url = "/search/"
  weight = 40

[[menu.main]]
  name = "关于"
  url = "/about.html"
  weight = 50
