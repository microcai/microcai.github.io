name: Build and deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 用与 GitHub Pages 自带构建相同的 gem 组合（Jekyll 3.9 + jekyll-paginate + kramdown GFM）
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - run: gem install github-pages --no-document

      # _plugins/render_math.rb 在 jekyll 构建结束后调用 node 把公式转成 MathML
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: jekyll build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
