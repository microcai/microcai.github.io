{{- /* 站点级自定义样式：换主题时这个文件要么保留，要么把里面的规则搬过去 */ -}}
<style>
  /* Hugo 的 MathML 外面有一层 span.katex 包装，去掉它的影响，让块级公式正常撑开 */
  span.katex { display: contents; }
  /* 宽公式允许突破正文栏宽（--main-width，现为 900px，见 assets/css/extended/blank.css），
     居中到页面；
     只有真的宽过视口时才出现横向滚动条 */
  math[display="block"] {
    width: max-content;
    max-width: calc(100vw - 3rem);
    margin-left: 50%;
    transform: translateX(-50%);
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: thin;
    padding: 0.35em 0;
  }

  /* Goldmark 渲染的脚注块（正文引用编号的落点） */
  .footnotes { font-size: 0.88em; opacity: 0.9; }
  .footnotes ol { padding-left: 1.4em; }
  .footnotes li { margin: 0.45em 0; }
  .footnote-backref { text-decoration: none; }

  /* ===== 首页两栏布局 ===== */
  .home-layout {
    display: flex;
    gap: var(--gap, 1.5rem);
    align-items: flex-start;
  }
  .home-sidebar {
    flex: 0 0 140px;       /* 侧栏固定 140px */
    position: sticky;
    top: var(--header-height, 64px);
  }
  .home-content {
    flex: 1;
    min-width: 0;          /* 防止内容撑破 flex */
  }

  /* 年份导航：竖排列表 */
  .year-nav-title {
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 0.5rem;
    color: var(--secondary);
  }
  .year-nav-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .year-nav-list li a {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.5rem;
    padding: 0.3rem 0.5rem;
    border-radius: 6px;
    text-decoration: none;
    color: var(--primary);
    font-size: 0.95rem;
    line-height: 1.4;
  }
  .year-nav-list li a:hover {
    background: var(--entry);
  }
  .year-nav-year { font-weight: 500; }
  .year-nav-count {
    font-size: 0.72rem;
    color: var(--secondary);
    opacity: 0.7;
  }

  /* 响应式：窄屏侧栏移到上方，变横排 */
  @media (max-width: 768px) {
    .home-layout { flex-direction: column; }
    .home-sidebar {
      flex: none;
      position: static;
    }
    .year-nav-list {
      flex-direction: row;
      flex-wrap: wrap;
      gap: 0.25rem;
    }
    .year-nav-list li a {
      padding: 0.2rem 0.6rem;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      border-radius: 999px;
    }
  }
</style>
